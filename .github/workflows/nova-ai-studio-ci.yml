name: NOVA AI STUDIO CI
on:
  push:
    paths:
      - 'nova-ai-studio/**'
      - '.github/workflows/nova-ai-studio-ci.yml'
  pull_request:
    paths:
      - 'nova-ai-studio/**'
      - '.github/workflows/nova-ai-studio-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-ai-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm test
